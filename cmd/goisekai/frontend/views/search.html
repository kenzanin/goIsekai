<section x-show="$store.app.currentView === 'search'" x-cloak x-data="searchView" class="fade-in min-h-[calc(100vh-57px)]">
  <div class="flex flex-wrap gap-4 px-6 py-6">
    <select x-model="pluginID" id="search-input-select"
            class="px-4 py-2.5 bg-surface-alt border border-border rounded-card text-zinc-100 font-sans text-base transition-colors focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-subtle">
      <option value="">Select a source…</option>
      <template x-for="p in $store.app.plugins" :key="p.ID">
        <option :value="p.ID" x-text="p.Name || p.ID"></option>
      </template>
    </select>
    <div class="flex gap-2 flex-1 min-w-[260px] items-center">
      <input x-model="query" @keydown.enter="search()" id="search-input" type="text" placeholder="Search manga…"
             autocomplete="off"
             class="flex-1 px-4 py-2.5 bg-surface-alt border border-border rounded-card text-zinc-100 font-sans text-base placeholder:text-muted transition-colors focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent-subtle" />
      <button @click="search()" :disabled="!pluginID || !query.trim()"
              class="px-5 py-2.5 rounded-card bg-accent text-white font-medium hover:bg-accent-hover hover:shadow-glow transition-all disabled:opacity-40 disabled:cursor-not-allowed">
        Search
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="flex flex-col items-center justify-center gap-4 py-16 text-zinc-400">
    <div class="w-10 h-10 border-[3px] border-border border-t-accent rounded-full animate-spin-slow"></div>
    <p>Searching…</p>
  </div>

  <!-- Error -->
  <div x-show="error" class="flex flex-col items-center justify-center gap-3 py-16 text-error">
    <span class="text-4xl">⚠️</span>
    <p x-text="error"></p>
    <button @click="search()" class="px-5 py-2 rounded-card border border-border text-zinc-100 hover:bg-surface-alt transition-all">Retry</button>
  </div>

  <!-- Empty state -->
  <div x-show="showEmpty" class="flex flex-col items-center justify-center gap-4 py-16">
    <span class="text-6xl">🔍</span>
    <h2 class="text-xl font-semibold text-zinc-100">No results found</h2>
    <p class="text-zinc-400 max-w-sm text-center">Try a different search term or source.</p>
  </div>

  <!-- Pre-search hint -->
  <div x-show="!searched && !loading && !error" class="flex flex-col items-center justify-center gap-4 py-16">
    <span class="text-6xl">🔍</span>
    <h2 class="text-xl font-semibold text-zinc-100">Search for manga</h2>
    <p class="text-zinc-400 max-w-sm text-center">Select a source, type a title, and press Enter or click Search.</p>
  </div>

  <!-- Results grid -->
  <div x-show="hasResults" class="grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-6 px-6">
    <template x-for="m in results" :key="m.id">
      <a :href="'#/manga/' + encodeURIComponent(pluginID) + '/' + encodeURIComponent(m.id)"
         class="flex flex-col bg-surface border border-border rounded-card overflow-hidden transition-all hover:-translate-y-1 hover:shadow-card-hover hover:border-accent no-underline text-inherit group">
        <div x-data="{ imgSrc: '', failed: false }" x-init="loadImage(pluginID, m.cover_url).then(u => { if(u) imgSrc = u; else failed = true; }).catch(() => failed = true)"
             class="relative aspect-[2/3] bg-surface-alt overflow-hidden cover-wrap"
             :class="{ 'cover-failed': failed }">
          <img :src="imgSrc" :alt="m.title || 'cover'" loading="lazy"
               @error="failed = true"
               class="w-full h-full object-cover block group-hover:scale-105 transition-transform">
          <div class="absolute inset-0 hidden items-center justify-center text-2xl font-bold text-zinc-400 bg-surface-elevated cover-fallback"
               x-text="getInitials(m.title)"></div>
          <div class="absolute inset-0 flex items-end p-2">
            <span x-show="m.status" x-text="m.status"
                  class="inline-block px-2 py-0.5 rounded bg-black/60 text-zinc-100 text-xs font-medium"></span>
          </div>
        </div>
        <div class="px-3 py-2 pb-3">
          <h3 class="text-base font-semibold text-zinc-100 truncate" x-text="m.title || 'Untitled'"></h3>
          <span class="block mt-0.5 text-sm text-zinc-400 truncate" x-text="m.author || ''"></span>
        </div>
      </a>
    </template>
  </div>

  <!-- Pagination -->
  <div x-show="hasResults" class="flex items-center justify-center gap-6 px-6 py-6 text-zinc-400 font-medium">
    <button @click="prevPage()" :disabled="page <= 1"
            class="px-5 py-2 rounded-card border border-border text-zinc-100 hover:bg-surface-alt transition-all disabled:opacity-40 disabled:cursor-not-allowed">← Prev</button>
    <span x-text="'Page ' + page"></span>
    <button @click="nextPage()"
            class="px-5 py-2 rounded-card border border-border text-zinc-100 hover:bg-surface-alt transition-all">Next →</button>
  </div>
</section>

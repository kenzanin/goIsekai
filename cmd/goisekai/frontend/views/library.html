<section x-show="$store.app.currentView === 'library'" x-cloak x-data="libraryView" class="fade-in min-h-[calc(100vh-57px)]">
  <div class="flex items-center justify-between px-6 py-6 pb-4">
    <h1 class="text-3xl font-bold text-zinc-100">Library</h1>
    <button @click="sync()" :disabled="syncing"
            class="inline-flex items-center gap-2 px-4 py-2 rounded-card bg-surface-alt text-zinc-100 font-medium transition-all hover:bg-surface-elevated disabled:opacity-40 disabled:cursor-not-allowed">
      <span x-show="!syncing">⟳ Sync</span>
      <span x-show="syncing">⏳ Syncing…</span>
    </button>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="flex flex-col items-center justify-center gap-4 py-16 text-zinc-400">
    <div class="w-10 h-10 border-[3px] border-border border-t-accent rounded-full animate-spin-slow"></div>
    <p>Loading library…</p>
  </div>

  <!-- Error -->
  <div x-show="error" class="flex flex-col items-center justify-center gap-3 py-16 text-error">
    <span class="text-4xl">⚠️</span>
    <p x-text="error"></p>
    <button @click="load()" class="px-5 py-2 rounded-card border border-border text-zinc-100 hover:bg-surface-alt transition-all">Retry</button>
  </div>

  <!-- Empty state -->
  <div x-show="!loading && !error && items.length === 0" class="flex flex-col items-center justify-center gap-4 py-16">
    <span class="text-6xl">📚</span>
    <h2 class="text-xl font-semibold text-zinc-100">Your library is empty</h2>
    <p class="text-zinc-400 max-w-sm text-center">Search for manga and add them here.</p>
    <a href="#/search" class="px-5 py-2 rounded-card bg-accent text-white font-medium hover:bg-accent-hover hover:shadow-glow transition-all">Browse Sources</a>
  </div>

  <!-- Grid -->
  <div x-show="!loading && items.length > 0" class="grid grid-cols-[repeat(auto-fill,minmax(180px,1fr))] gap-6 px-6">
    <template x-for="manga in items" :key="manga.ID + manga.SourceMangaID">
      <a :href="'#/manga/' + encodeURIComponent(manga.PluginID) + '/' + encodeURIComponent(manga.SourceMangaID)"
         class="flex flex-col bg-surface border border-border rounded-card overflow-hidden transition-all hover:-translate-y-1 hover:shadow-card-hover hover:border-accent no-underline text-inherit group">
        <div x-data="{ imgSrc: '', failed: false }" x-init="loadImage(manga.PluginID, manga.CoverURL).then(u => { if(u) imgSrc = u; else failed = true; }).catch(() => failed = true)"
             class="relative aspect-[2/3] bg-surface-alt overflow-hidden cover-wrap"
             :class="{ 'cover-failed': failed }">
          <img :src="imgSrc" :alt="manga.Title || 'cover'" loading="lazy"
               @error="failed = true"
               class="w-full h-full object-cover block group-hover:scale-105 transition-transform">
          <div class="absolute inset-0 hidden items-center justify-center text-2xl font-bold text-zinc-400 bg-surface-elevated cover-fallback"
               x-text="getInitials(manga.Title)"></div>
          <div class="absolute inset-0 flex items-end p-2">
            <span x-show="manga.Status" x-text="manga.Status"
                  class="inline-block px-2 py-0.5 rounded bg-black/60 text-zinc-100 text-xs font-medium"></span>
          </div>
        </div>
        <div class="px-3 py-2 pb-3">
          <h3 class="text-base font-semibold text-zinc-100 truncate" x-text="manga.Title || 'Untitled'"></h3>
          <span class="block mt-0.5 text-sm text-zinc-400 truncate" x-text="$store.app.pluginName(manga.PluginID) || manga.PluginID"></span>
        </div>
      </a>
    </template>
  </div>
</section>

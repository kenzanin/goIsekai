<section x-show="$store.app.currentView === 'settings'" x-cloak x-data="settingsView" class="fade-in min-h-[calc(100vh-57px)]">
  <div class="flex items-center justify-between px-6 py-6 pb-4">
    <h1 class="text-3xl font-bold text-zinc-100">Settings</h1>
  </div>

  <div class="px-6 space-y-8 max-w-2xl">
    <!-- Image rendering -->
    <section class="space-y-3">
      <h2 class="text-lg font-semibold text-zinc-100">Image Rendering</h2>
      <p class="text-sm text-zinc-400">Control how manga pages are scaled and composited.</p>
      <div class="grid grid-cols-[1fr_auto] items-center gap-4">
        <select x-model="renderMode" @change="persist()"
                class="px-4 py-2 bg-surface-alt border border-border rounded-card text-zinc-100 focus:outline-none focus:border-accent">
          <option value="smooth">Smooth (bilinear)</option>
          <option value="sharp">Sharp Pixels (pixelated)</option>
        </select>
        <label class="flex items-center gap-2">
          <input type="checkbox" :checked="gpuCompositing" @change="gpuCompositing = !gpuCompositing; persist()"
                 style="accent-color: #7c5cfc" class="w-5 h-5" />
          <span class="text-sm text-zinc-300">GPU compositing</span>
        </label>
      </div>
    </section>

    <!-- Reading preferences -->
    <section class="space-y-3">
      <h2 class="text-lg font-semibold text-zinc-100">Reading</h2>
      <div class="grid grid-cols-[1fr_auto] items-center gap-4">
        <select x-model="direction" @change="persist()"
                class="px-4 py-2 bg-surface-alt border border-border rounded-card text-zinc-100 focus:outline-none focus:border-accent">
          <option value="ltr">Left → Right (webtoon)</option>
          <option value="rtl">Right → Left (manga)</option>
        </select>
      </div>
      <div class="grid grid-cols-[1fr_auto] items-center gap-4">
        <select x-model="viewMode" @change="persist()"
                class="px-4 py-2 bg-surface-alt border border-border rounded-card text-zinc-100 focus:outline-none focus:border-accent">
          <option value="fitWidth">Fit Width</option>
          <option value="fitHeight">Fit Height</option>
          <option value="original">Original</option>
        </select>
      </div>
      <div class="grid grid-cols-[1fr_auto] items-center gap-4">
        <input type="number" x-model="readAhead" min="0" max="10" step="1"
               @change="setReadAhead(readAhead); persist()"
               class="w-24 px-4 py-2 bg-surface-alt border border-border rounded-card text-zinc-100 focus:outline-none focus:border-accent" />
      </div>
      <p class="text-xs text-zinc-500">Read-ahead chapters: how many upcoming chapters' pages are prefetched in the background.</p>
    </section>

    <!-- App config -->
    <section class="space-y-3">
      <h2 class="text-lg font-semibold text-zinc-100">App Config</h2>
      <p class="text-sm text-zinc-400">Config file: <code x-text="configPath" class="text-accent"></code></p>
      <button @click="reloadConfig()" class="px-4 py-2 bg-surface-alt border border-border rounded-card text-zinc-100 hover:bg-white/10 transition-all text-sm">Reload Config</button>
      <span x-show="configStatus" x-text="configStatus" class="text-sm text-accent ml-2"></span>
    </section>
  </div>
</section>

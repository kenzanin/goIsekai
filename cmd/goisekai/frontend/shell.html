<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>goIsekai</title>
  <style>body{font-family:Inter,system-ui,sans-serif;background:#0f0f14;color:#e4e4e7}</style>
  <div id="js-errors" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#c00;color:white;padding:12px;font-size:13px;font-family:monospace;display:none;white-space:pre-wrap;max-height:40vh;overflow:auto;cursor:pointer" onclick="this.style.display='none'" title="click to dismiss"></div>
  <script>
    (()=> {
      var box=document.getElementById('js-errors');
      function show(msg){
        // Filter out benign Wails internal LOAD FAILs (favicon, runtime, etc.)
        if (/LOAD FAIL: wails:\/\/localhost\/?$/.test(msg)) return;
        box.style.display='block';
        box.textContent+=`${msg}\n`;
      }
      window.onerror=(m,s,l,c,_e)=> {show(`ERROR: ${m} (${s}:${l}:${c})`);};
      window.addEventListener('unhandledrejection',(e)=> {show(`PROMISE: ${e.reason?.message||e.reason||'unknown'}`)});
      window.addEventListener('error',(e)=> {if(e.target?.src)show(`LOAD FAIL: ${e.target.src}`);},true);
    })();
  </script>
  <link rel="stylesheet" href="/lib/tailwind.css" />
  <script type="module" src="app.js"></script>
  <script defer src="/lib/alpine.min.js"></script>
  <style>
    /* Minimal custom overrides that Tailwind can't handle inline */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-spin-slow { animation: spin 0.8s linear infinite; }
    .fade-in { animation: fadeIn 0.2s ease; }
    [x-cloak] { display: none; }
    /* Reader slider accent */
    input[type="range"].accent-slider { accent-color: #7c5cfc; }
    /* Scrollbar hiding for reader */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* Cover fallback on image error */
    .cover-wrap img.cover-failed { display: none; }
    .cover-wrap .cover-fallback { display: none; }
    .cover-wrap.cover-failed img { display: none; }
    .cover-wrap.cover-failed .cover-fallback { display: flex; }
    /* Progress bar */
    .progress-fill { height: 4px; border-radius: 9999px; background: #4ade80; }
    /* Reader canvas */
    #reader-canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      position: relative;
      z-index: 1;
    }
    #reader-canvas:active {
      cursor: grabbing;
    }
    /* Reader progress bar (accent purple) */
    .reader-progress-fill { height: 4px; border-radius: 9999px; background: #7c5cfc; }
  </style>
</head>
<body class="bg-bg text-zinc-200 font-sans min-h-screen antialiased" x-data x-init="$store.app.updateRoute()">

  <!-- ── Reader View ──────────────────────────────────────────────── -->

  <!-- ── Plugins View ─────────────────────────────────────────────── -->

  <!-- ── Settings View ─────────────────────────────────────────────── -->
  <!-- @partial:settings -->

</body>
</html>

version: "2"

linters:
  enable:
    - staticcheck
    - unused
  exclusions:
    rules:
      # go-jet uses dot imports by convention for DSL readability
      - path: internal/database/
        linters:
          - staticcheck
        text: "ST1001"
      # reflect.Ptr is a readable constant; inlining to raw value hurts clarity
      - path: internal/templates/
        linters:
          - govet
        text: "should be inlined"
